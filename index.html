<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Game</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="app__header">
      <h1 class="app__title">SNAKE GAME</h1>
      <div class="scoreboard">
        <div class="scoreboard__item">
          <span class="scoreboard__label">SCORE</span>
          <span class="scoreboard__value" id="scoreValue">0</span>
        </div>
        <div class="scoreboard__item">
          <span class="scoreboard__label">BEST</span>
          <span class="scoreboard__value" id="bestValue">0</span>
        </div>
      </div>
    </header>

    <main class="board-wrap">
      <canvas id="board" width="400" height="400"></canvas>

      <div class="overlay" id="startOverlay">
        <div class="overlay__panel">
          <h2 class="overlay__title">SNAKE GAME</h2>
          <p class="overlay__text">먹이를 먹고 최대한 오래 살아남으세요!</p>
          <button class="btn" id="startBtn">START</button>
        </div>
      </div>

      <div class="overlay overlay--hidden" id="gameOverOverlay">
        <div class="overlay__panel">
          <h2 class="overlay__title">GAME OVER</h2>
          <div class="overlay__stats">
            <div class="overlay__stat">
              <span class="overlay__stat-label">SCORE</span>
              <span class="overlay__stat-value" id="finalScore">0</span>
            </div>
            <div class="overlay__stat">
              <span class="overlay__stat-label">BEST</span>
              <span class="overlay__stat-value" id="finalBest">0</span>
            </div>
          </div>
          <button class="btn" id="restartBtn">다시 시작</button>
        </div>
      </div>
    </main>

    <footer class="controls">
      <p class="controls__hint">PC: 방향키(↑↓←→)로 이동하세요</p>
      <div class="touch-pad" id="touchPad">
        <button class="touch-btn touch-btn--up" data-dir="up" aria-label="위로 이동">▲</button>
        <div class="touch-pad__row">
          <button class="touch-btn touch-btn--left" data-dir="left" aria-label="왼쪽으로 이동">◀</button>
          <button class="touch-btn touch-btn--down" data-dir="down" aria-label="아래로 이동">▼</button>
          <button class="touch-btn touch-btn--right" data-dir="right" aria-label="오른쪽으로 이동">▶</button>
        </div>
      </div>
    </footer>
  </div>

  <script src="game.js" defer></script>
</body>
</html>
